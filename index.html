<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StoryFrame — Gerador de Storyboards</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --surface: #161616; --surface2: #1f1f1f; --border: #2a2a2a;
      --accent: #e8d5a3; --accent2: #c4a882; --text: #f0ece4; --muted: #7a7570;
      --danger: #e06c5a; --green: #7ec8a0; --frame-bg: #111;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }
    header { border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(13,13,13,0.95); backdrop-filter: blur(12px); z-index: 100; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--accent); }
    .logo span { color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 2px; margin-left: 12px; vertical-align: middle; }
    .header-badge { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 2px; letter-spacing: 1px; }
    main { max-width: 1200px; margin: 0 auto; padding: 60px 40px; }
    .hero { margin-bottom: 60px; animation: fadeUp 0.6s ease both; }
    .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 8vw, 96px); line-height: 0.9; letter-spacing: 2px; color: var(--text); margin-bottom: 16px; }
    .hero h1 em { font-style: normal; color: var(--accent); -webkit-text-stroke: 1px var(--accent2); }
    .hero p { color: var(--muted); font-size: 15px; max-width: 500px; line-height: 1.7; }
    .input-section { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 32px; margin-bottom: 40px; animation: fadeUp 0.6s 0.1s ease both; position: relative; }
    .input-section::before { content: 'NARRATIVA'; position: absolute; top: -10px; left: 24px; background: var(--surface); padding: 0 8px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 2px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .field select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; border-radius: 2px; outline: none; transition: border-color 0.2s; appearance: none; cursor: pointer; }
    .field select:focus { border-color: var(--accent); }
    textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 16px; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.7; border-radius: 2px; resize: vertical; min-height: 140px; outline: none; transition: border-color 0.2s; margin-bottom: 8px; }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .char-counter { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; margin-bottom: 20px; letter-spacing: 1px; }
    .btn-row { display: flex; gap: 12px; }
    .btn-generate { flex: 1; background: var(--accent); color: #0d0d0d; border: none; padding: 14px 32px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; cursor: pointer; border-radius: 2px; transition: background 0.2s, transform 0.1s; }
    .btn-generate:hover { background: var(--accent2); }
    .btn-generate:active { transform: scale(0.99); }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 14px 20px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }
    .powered-by { text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 8px; opacity: 0.5; }
    .status { display: none; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; margin-bottom: 30px; }
    .status.loading { display: flex; background: rgba(232,213,163,0.06); color: var(--accent); border: 1px solid rgba(232,213,163,0.15); }
    .status.error { display: flex; background: rgba(224,108,90,0.08); color: var(--danger); border: 1px solid rgba(224,108,90,0.2); }
    .loading-animation { display: flex; gap: 4px; align-items: center; }
    .loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.2s ease-in-out infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    .timer { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-left: auto; }
    @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    #output { display: none; animation: fadeUp 0.5s ease both; }
    .output-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
    .output-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: var(--accent); }
    .output-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }
    .output-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--green); letter-spacing: 1px; margin-top: 4px; }
    .btn-export { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 8px 20px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
    .btn-export:hover { background: var(--accent); color: #0d0d0d; }
    .storyboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .scene-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; animation: fadeUp 0.4s ease both; transition: border-color 0.2s, transform 0.2s; }
    .scene-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
    .frame-visual { aspect-ratio: 16/9; background: var(--frame-bg); position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .frame-number { position: absolute; top: 10px; left: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: rgba(232,213,163,0.5); letter-spacing: 1px; z-index: 2; text-shadow: 0 0 20px rgba(232,213,163,0.3); }
    .frame-shot-type { position: absolute; bottom: 10px; right: 12px; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--accent); background: rgba(13,13,13,0.8); padding: 3px 8px; border-radius: 2px; text-transform: uppercase; z-index: 2; border: 1px solid rgba(232,213,163,0.1); }
    .frame-drawing { position: absolute; inset: 0; }
    .frame-drawing svg { width: 100%; height: 100%; }
    .scene-info { padding: 16px 18px; }
    .scene-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .scene-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--text); flex: 1; }
    .btn-regen { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; cursor: pointer; border-radius: 2px; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
    .btn-regen:hover { border-color: var(--accent); color: var(--accent); }
    .btn-regen:disabled { opacity: 0.3; cursor: not-allowed; }
    .scene-description { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; cursor: pointer; border-radius: 2px; padding: 4px; transition: background 0.2s; }
    .scene-description:hover { background: rgba(255,255,255,0.03); }
    .scene-description.editing { background: var(--surface2); border: 1px solid var(--accent); padding: 8px; outline: none; width: 100%; font-size: 13px; color: var(--text); line-height: 1.6; font-family: 'DM Sans', sans-serif; resize: none; border-radius: 2px; }
    .scene-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .meta-tag { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 2px; text-transform: uppercase; }
    .tag-transition { background: rgba(126,200,160,0.1); color: var(--green); border: 1px solid rgba(126,200,160,0.2); }
    .tag-camera { background: rgba(232,213,163,0.08); color: var(--accent); border: 1px solid rgba(232,213,163,0.15); }
    .tag-duration { background: rgba(122,117,112,0.1); color: var(--muted); border: 1px solid var(--border); }
    .scene-ambiente { margin-top: 8px; font-size: 12px; color: var(--muted); opacity: 0.7; }
    .edit-hint { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); opacity: 0.5; margin-top: 6px; letter-spacing: 1px; }
    @media print {
      body { background: white; color: black; }
      header, .input-section, .status, .btn-export, .btn-regen, .edit-hint { display: none !important; }
      .scene-card { border: 1px solid #ccc; break-inside: avoid; page-break-inside: avoid; }
      .frame-visual { background: #1a1a1a !important; }
      .frame-drawing svg { opacity: 1 !important; }
      .frame-shot-type { color: #c4a882 !important; background: rgba(0,0,0,0.5) !important; }
      .frame-number { color: rgba(232,213,163,0.6) !important; }
      #output { display: block !important; }
      .print-header { display: block !important; margin-bottom: 24px; }
      .scene-description { color: #333 !important; }
      .scene-title { color: #000 !important; }
    }
    .print-header { display: none; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 24px; }
    .print-header h2 { font-size: 28px; margin-bottom: 4px; font-family: sans-serif; }
    .print-header p { font-size: 12px; color: #666; font-family: sans-serif; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) { main { padding: 40px 20px; } header { padding: 16px 20px; } .input-row { grid-template-columns: 1fr; } .storyboard-grid { grid-template-columns: 1fr; } .btn-row { flex-direction: column; } }
  </style>
</head>
<body>
<header>
  <div class="logo">StoryFrame <span>v1.0</span></div>
  <div class="header-badge">IPVC · ESTG · ECGM</div>
</header>
<main>
  <div class="hero">
    <h1>GERA O TEU<br><em>STORYBOARD</em></h1>
    <p>Descreve a tua narrativa e a IA estrutura automaticamente as cenas, enquadramentos e transições cinematográficas.</p>
  </div>
  <div class="input-section">
    <div class="input-row">
      <div class="field">
        <label>Género</label>
        <select id="genre">
          <option value="cinematográfico">Cinematográfico</option>
          <option value="documental">Documental</option>
          <option value="publicidade">Publicidade</option>
          <option value="videoclip">Videoclip</option>
          <option value="animação">Animação</option>
          <option value="videojogo">Videojogo / Cutscene</option>
          <option value="série TV">Série TV</option>
          <option value="curta-metragem">Curta-Metragem</option>
          <option value="institucional">Institucional</option>
        </select>
      </div>
      <div class="field">
        <label>Número de Cenas</label>
        <select id="numScenes">
          <option value="4">4 cenas</option>
          <option value="6" selected>6 cenas</option>
          <option value="8">8 cenas</option>
          <option value="10">10 cenas</option>
        </select>
      </div>
    </div>
    <textarea id="narrative" placeholder="Ex: Uma detetive recebe uma carta misteriosa escrita por ela mesma há 20 anos, descrevendo com detalhe o crime que está a investigar hoje..." oninput="updateCounter()"></textarea>
    <div class="char-counter"><span id="charCount">0</span> / 500 CARACTERES</div>
    <div class="btn-row">
      <button class="btn-generate" id="generateBtn" onclick="generateStoryboard()">GERAR STORYBOARD</button>
      <button class="btn-clear" onclick="clearForm()">LIMPAR</button>
    </div>
    <div class="powered-by">POWERED BY GROQ AI · LLAMA 3.3</div>
  </div>
  <div class="status" id="status">
    <div class="loading-animation">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
    <span id="statusText">A gerar storyboard com IA...</span>
    <span class="timer" id="timerDisplay"></span>
  </div>
  <div id="output">
    <div class="print-header">
      <h2 id="printTitle">STORYBOARD</h2>
      <p id="printMeta"></p>
    </div>
    <div class="output-header">
      <div>
        <div class="output-title">STORYBOARD</div>
        <div class="output-meta" id="outputMeta"></div>
        <div class="output-time" id="outputTime"></div>
      </div>
      <button class="btn-export" onclick="window.print()">EXPORTAR / IMPRIMIR</button>
    </div>
    <div class="storyboard-grid" id="storyboardGrid"></div>
  </div>
</main>
<script>
  var GROQ_API_KEY = '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';
  var currentNarrative = '';
  var currentGenre = '';
  var currentScenes = [];
  var timerInterval = null;
  var startTime = null;

  function updateCounter() {
    document.getElementById('charCount').textContent = document.getElementById('narrative').value.length;
  }

  function clearForm() {
    document.getElementById('narrative').value = '';
    document.getElementById('charCount').textContent = '0';
    document.getElementById('genre').selectedIndex = 0;
    document.getElementById('numScenes').selectedIndex = 1;
    document.getElementById('output').style.display = 'none';
    hideStatus();
    currentScenes = [];
  }

  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(function() {
      document.getElementById('timerDisplay').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    return ((Date.now() - startTime) / 1000).toFixed(1);
  }

  // Gera SVG contextual baseado na descrição e tipo de plano
  function generateContextualSVG(descricao, tipoPlano, titulo) {
    var d = (descricao + ' ' + titulo).toLowerCase();
    var s = tipoPlano ? tipoPlano.toLowerCase() : '';

    // Detecta elementos da cena
    var hasPerson = /person|protagonist|personag|person|homem|mulher|detetive|ladrão|relojoeiro|músico|pintor|astronauta|figura|silhueta|ator|atriz|herói/.test(d);
    var hasBuilding = /edifício|casa|sala|interior|corredor|janela|quarto|escritório|hospital|estação|nave|galeria|estúdio/.test(d);
    var hasNight = /noite|noturno|escuro|sombra|lua|estrela|neon/.test(d);
    var hasNature = /floresta|mar|montanha|campo|rio|praia|céu|árvore|exterior/.test(d);
    var hasObject = /relógio|quadro|carta|livro|piano|câmara|objeto|instrumento|produto/.test(d);
    var hasAction = /correr|lutar|mover|caminhar|perseguição|explosion|movimento|rápido/.test(d);
    var hasEmotion = /rosto|olhos|expressão|close|íntimo|emoção/.test(d);

    // Cores baseadas no ambiente
    var strokeColor = hasNight ? '#7090c0' : '#e8d5a3';
    var bgGlow = hasNight ? 'rgba(70,100,180,0.08)' : 'rgba(232,213,163,0.04)';

    var elements = [];

    // Frame base sempre presente
    var frameOpacity = '0.25';
    if (s.includes('detalhe')) {
      elements.push('<rect x="95" y="45" width="130" height="90" rx="2" fill="none" stroke="' + strokeColor + '" stroke-width="2" opacity="' + frameOpacity + '"/>');
    } else if (s.includes('geral')) {
      elements.push('<rect x="10" y="10" width="300" height="160" rx="2" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="' + frameOpacity + '"/>');
    } else {
      elements.push('<rect x="40" y="20" width="240" height="140" rx="2" fill="none" stroke="' + strokeColor + '" stroke-width="1.2" opacity="' + frameOpacity + '"/>');
    }

    // Fundo contextual
    if (hasNight) {
      // Céu noturno
      elements.push('<rect x="0" y="0" width="320" height="180" fill="url(#nightGrad)" opacity="0.3"/>');
      elements.push('<defs><linearGradient id="nightGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient></defs>');
      // Estrelas
      for (var i = 0; i < 8; i++) {
        var sx = 20 + (i * 37) % 280;
        var sy = 15 + (i * 23) % 60;
        elements.push('<circle cx="' + sx + '" cy="' + sy + '" r="1" fill="' + strokeColor + '" opacity="0.4"/>');
      }
    } else if (hasNature) {
      // Horizonte
      elements.push('<path d="M0 120 Q80 100 160 110 Q240 120 320 105" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.2"/>');
      // Árvores simples
      elements.push('<line x1="50" y1="120" x2="50" y2="160" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.2"/>');
      elements.push('<ellipse cx="50" cy="110" rx="18" ry="15" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.2"/>');
      elements.push('<line x1="270" y1="115" x2="270" y2="160" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.2"/>');
      elements.push('<ellipse cx="270" cy="105" rx="16" ry="13" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.2"/>');
    } else if (hasBuilding) {
      // Interior — linha do chão e parede
      elements.push('<line x1="0" y1="140" x2="320" y2="140" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.15"/>');
      elements.push('<line x1="60" y1="0" x2="60" y2="180" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.1"/>');
      elements.push('<line x1="260" y1="0" x2="260" y2="180" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.1"/>');
      // Janela
      elements.push('<rect x="220" y="40" width="50" height="60" rx="1" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.2"/>');
      elements.push('<line x1="245" y1="40" x2="245" y2="100" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.15"/>');
      elements.push('<line x1="220" y1="70" x2="270" y2="70" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.15"/>');
    }

    // Personagem baseado no tipo de plano
    if (hasPerson) {
      if (s.includes('grande') || s.includes('detalhe')) {
        // Rosto grande
        elements.push('<ellipse cx="160" cy="80" rx="45" ry="52" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.45"/>');
        elements.push('<circle cx="160" cy="65" r="22" fill="none" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.5"/>');
        elements.push('<ellipse cx="148" cy="62" rx="6" ry="4" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.4"/>');
        elements.push('<ellipse cx="172" cy="62" rx="6" ry="4" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.4"/>');
        elements.push('<path d="M148 80 Q160 87 172 80" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.35"/>');
        elements.push('<line x1="160" y1="87" x2="160" y2="110" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.3"/>');
      } else if (s.includes('médio') || s.includes('americano')) {
        // Meia figura
        elements.push('<ellipse cx="160" cy="65" rx="22" ry="26" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        elements.push('<circle cx="160" cy="53" r="13" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.4"/>');
        elements.push(`<path d="M120 ${s.includes('americano') ? '145' : '130'} Q138 95 160 90 Q182 95 200 ${s.includes('americano') ? '145' : '130'}" fill="none" stroke="${strokeColor}" stroke-width="1.5" opacity="0.35"/>`);
        if (s.includes('americano')) {
          elements.push('<line x1="140" y1="115" x2="180" y2="115" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4"/>');
        }
      } else if (s.includes('geral') || s.includes('conjunto')) {
        // Figuras pequenas
        var positions = [[100, 90], [160, 85], [220, 92]];
        positions.forEach(function(p) {
          elements.push('<ellipse cx="' + p[0] + '" cy="' + (p[1]-8) + '" rx="8" ry="9" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.3"/>');
          elements.push('<path d="M' + (p[0]-12) + ' 130 Q' + (p[0]-5) + ' ' + (p[1]+5) + ' ' + p[0] + ' ' + (p[1]+3) + ' Q' + (p[0]+5) + ' ' + (p[1]+5) + ' ' + (p[0]+12) + ' 130" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.25"/>');
        });
        elements.push('<line x1="20" y1="130" x2="300" y2="130" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.15"/>');
      } else if (s.includes('picado')) {
        // Vista de cima
        elements.push('<ellipse cx="160" cy="120" rx="55" ry="18" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.3"/>');
        elements.push('<ellipse cx="160" cy="118" rx="16" ry="8" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.4"/>');
        elements.push('<line x1="144" y1="118" x2="160" y2="55" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.35"/>');
        elements.push('<line x1="176" y1="118" x2="160" y2="55" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.35"/>');
      } else if (s.includes('contrapicado')) {
        // Vista de baixo
        elements.push('<ellipse cx="160" cy="45" rx="55" ry="18" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.3"/>');
        elements.push('<ellipse cx="160" cy="47" rx="18" ry="9" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.45"/>');
        elements.push('<line x1="142" y1="47" x2="160" y2="155" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.4"/>');
        elements.push('<line x1="178" y1="47" x2="160" y2="155" stroke="' + strokeColor + '" stroke-width="1.2" opacity="0.4"/>');
      } else {
        // Default personagem
        elements.push('<ellipse cx="160" cy="70" rx="25" ry="28" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        elements.push('<circle cx="160" cy="58" r="14" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.4"/>');
        elements.push('<path d="M115 145 Q135 95 160 90 Q185 95 205 145" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.35"/>');
      }
    }

    // Objeto em destaque
    if (hasObject && !hasPerson) {
      if (d.includes('relógio')) {
        elements.push('<circle cx="160" cy="90" r="40" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        elements.push('<circle cx="160" cy="90" r="35" fill="none" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.2"/>');
        elements.push('<line x1="160" y1="90" x2="160" y2="60" stroke="' + strokeColor + '" stroke-width="2" opacity="0.5"/>');
        elements.push('<line x1="160" y1="90" x2="185" y2="95" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        for (var h = 0; h < 12; h++) {
          var angle = (h * 30 - 90) * Math.PI / 180;
          var hx = 160 + 32 * Math.cos(angle);
          var hy = 90 + 32 * Math.sin(angle);
          elements.push('<circle cx="' + hx.toFixed(1) + '" cy="' + hy.toFixed(1) + '" r="1.5" fill="' + strokeColor + '" opacity="0.3"/>');
        }
      } else if (d.includes('quadro') || d.includes('pintura')) {
        elements.push('<rect x="100" y="40" width="120" height="90" rx="2" fill="none" stroke="' + strokeColor + '" stroke-width="2" opacity="0.4"/>');
        elements.push('<rect x="108" y="48" width="104" height="74" rx="1" fill="none" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.25"/>');
        elements.push('<path d="M108 122 Q140 80 160 90 Q180 100 212 48" fill="none" stroke="' + strokeColor + '" stroke-width="1" opacity="0.3"/>');
      } else if (d.includes('carta') || d.includes('livro')) {
        elements.push('<rect x="110" y="55" width="100" height="70" rx="2" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        elements.push('<line x1="120" y1="75" x2="200" y2="75" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.3"/>');
        elements.push('<line x1="120" y1="88" x2="200" y2="88" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.3"/>');
        elements.push('<line x1="120" y1="101" x2="175" y2="101" stroke="' + strokeColor + '" stroke-width="0.8" opacity="0.3"/>');
      } else {
        elements.push('<circle cx="160" cy="90" r="30" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
        elements.push('<line x1="130" y1="90" x2="190" y2="90" stroke="' + strokeColor + '" stroke-width="1" opacity="0.3"/>');
        elements.push('<line x1="160" y1="60" x2="160" y2="120" stroke="' + strokeColor + '" stroke-width="1" opacity="0.3"/>');
      }
    }

    // Luz direcional
    if (hasNight) {
      elements.push('<line x1="160" y1="0" x2="160" y2="30" stroke="' + strokeColor + '" stroke-width="0.5" opacity="0.15" stroke-dasharray="3,5"/>');
    }

    // Plano sequência — linha de movimento
    if (s.includes('sequência') || s.includes('sequencia')) {
      elements.push('<path d="M40 140 Q80 80 120 100 Q160 120 200 70 Q240 30 280 90" fill="none" stroke="' + strokeColor + '" stroke-width="2" opacity="0.4"/>');
      elements.push('<circle cx="40" cy="140" r="4" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
      elements.push('<path d="M274 84 L280 90 L274 96" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" opacity="0.4"/>');
    }

    return '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">' + elements.join('') + '</svg>';
  }

  async function callGroq(prompt) {
    var response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.8,
        max_tokens: 3000
      })
    });
    if (!response.ok) {
      var errData = await response.json();
      throw new Error(errData.error ? errData.error.message : 'Erro na API Groq');
    }
    var data = await response.json();
    var rawText = data.choices[0].message.content;
    var jsonText = rawText
      .replace(/```json\n?/g, '').replace(/```\n?/g, '')
      .replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'")
      .trim();
    var jsonMatch = jsonText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('Resposta inválida — tenta novamente');
    return JSON.parse(jsonMatch[0]);
  }

  async function generateStoryboard() {
    var narrative = document.getElementById('narrative').value.trim();
    var genre = document.getElementById('genre').value;
    var numScenes = document.getElementById('numScenes').value;
    if (!narrative) { showStatus('error', 'Escreve uma narrativa primeiro.'); return; }
    currentNarrative = narrative;
    currentGenre = genre;
    var btn = document.getElementById('generateBtn');
    btn.disabled = true;
    document.getElementById('output').style.display = 'none';
    showStatus('loading', 'A gerar storyboard com IA...');
    startTimer();

    var prompt = 'És um especialista em storyboards cinematográficos. Cria um storyboard com exatamente ' + numScenes + ' cenas para o género "' + genre + '" baseado nesta narrativa: "' + narrative + '". Responde APENAS com JSON válido, sem markdown, sem backticks, sem texto extra. Usa este formato exato: {"titulo":"Título do Storyboard","cenas":[{"numero":1,"titulo":"Título da cena","descricao":"Descrição visual detalhada e específica para esta narrativa em MÁXIMO 2 frases curtas","tipo_plano":"Plano Geral","movimento_camara":"Fixo","transicao":"Corte","duracao":"5s","ambiente":"Descrição de luz e ambiente específica para esta cena"}]}. Tipos de plano permitidos: Plano Geral, Plano Médio, Grande Plano, Plano Detalhe, Plano Picado, Plano Contrapicado, Plano Americano, Plano Sequência. As descrições devem ser únicas, específicas para a narrativa e NÃO podem todas começar com "A câmara". Cria exatamente ' + numScenes + ' cenas.';

    try {
      var parsed = await callGroq(prompt);
      if (!parsed.cenas || !Array.isArray(parsed.cenas)) throw new Error('Formato inesperado — tenta novamente');
      var elapsed = stopTimer();
      currentScenes = parsed.cenas;
      hideStatus();
      renderStoryboard(parsed, genre, narrative, elapsed);
    } catch (err) {
      stopTimer();
      showStatus('error', 'Erro: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function regenScene(index) {
  var btn = document.querySelector('[data-regen="' + index + '"]');
  if (btn) btn.disabled = true;

  var cenaAtual = currentScenes[index];
  var descAtual = cenaAtual ? cenaAtual.descricao : '';
  var tituloAtual = cenaAtual ? cenaAtual.titulo : '';
  var tipoPlanoAtual = cenaAtual ? cenaAtual.tipo_plano : 'Plano Médio';

  var prompt = 'És um especialista em storyboards. Reescreve esta cena com outras palavras mas mantendo EXATAMENTE o mesmo momento narrativo, a mesma ação e o mesmo conteúdo visual. NÃO mudes o que acontece, só a forma de descrever. Cena atual: título="' + tituloAtual + '", descrição="' + descAtual + '". Narrativa geral: "' + currentNarrative + '". Responde APENAS com JSON: {"numero":' + (index + 1) + ',"titulo":"' + tituloAtual + '","descricao":"Mesma cena reescrita em MÁXIMO 2 frases curtas","tipo_plano":"' + tipoPlanoAtual + '","movimento_camara":"Fixo","transicao":"Corte","duracao":"5s","ambiente":"Descrição de luz"}. O tipo_plano deve ser exatamente "' + tipoPlanoAtual + '".';

  try {
    var parsed = await callGroq(prompt);
    parsed.tipo_plano = tipoPlanoAtual;
    currentScenes[index] = parsed;
    updateSceneCard(index, parsed);
  } catch (err) {
    console.error('Erro ao regenerar cena:', err);
  } finally {
    if (btn) btn.disabled = false;
  }
}

  function updateSceneCard(index, cena) {
    var card = document.querySelector('[data-scene="' + index + '"]');
    if (!card) return;
    card.querySelector('.frame-drawing').innerHTML = generateContextualSVG(cena.descricao, cena.tipo_plano, cena.titulo);
    card.querySelector('.frame-shot-type').textContent = cena.tipo_plano || 'Plano';
    card.querySelector('.scene-title').textContent = cena.titulo;
    var descEl = card.querySelector('.scene-description');
    if (descEl) descEl.textContent = cena.descricao;
    var tags = card.querySelectorAll('.meta-tag');
    if (tags[0]) tags[0].textContent = cena.transicao || '';
    if (tags[1]) tags[1].textContent = cena.movimento_camara || '';
    if (tags[2]) tags[2].textContent = cena.duracao || '';
    var amb = card.querySelector('.scene-ambiente');
    if (amb && cena.ambiente) amb.textContent = '💡 ' + cena.ambiente;
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'fadeUp 0.4s ease both';
  }

  function makeDescEditable(el, index) {
    var current = el.textContent;
    var textarea = document.createElement('textarea');
    textarea.className = 'scene-description editing';
    textarea.value = current;
    textarea.rows = 4;
    el.replaceWith(textarea);
    textarea.focus();
    function save() {
      var newText = textarea.value.trim() || current;
      if (currentScenes[index]) currentScenes[index].descricao = newText;
      var newEl = document.createElement('div');
      newEl.className = 'scene-description';
      newEl.textContent = newText;
      newEl.title = 'Clica para editar';
      newEl.onclick = function() { makeDescEditable(newEl, index); };
      textarea.replaceWith(newEl);
    }
    textarea.onblur = save;
    textarea.onkeydown = function(e) { if (e.key === 'Escape') { textarea.value = current; save(); } };
  }

  function renderStoryboard(data, genre, narrative, elapsed) {
    var grid = document.getElementById('storyboardGrid');
    var output = document.getElementById('output');
    var meta = document.getElementById('outputMeta');
    var timeEl = document.getElementById('outputTime');
    var dateStr = new Date().toLocaleDateString('pt-PT');
    grid.innerHTML = '';
    meta.textContent = data.cenas.length + ' CENAS · ' + genre.toUpperCase() + ' · ' + dateStr;
    if (elapsed) timeEl.textContent = '⚡ Gerado em ' + elapsed + 's';
    document.getElementById('printTitle').textContent = narrative.substring(0, 60) + (narrative.length > 60 ? '...' : '');
    document.getElementById('printMeta').textContent = data.cenas.length + ' cenas · ' + genre.toUpperCase() + ' · ' + dateStr;

    data.cenas.forEach(function(cena, i) {
      var card = document.createElement('div');
      card.className = 'scene-card';
      card.setAttribute('data-scene', i);
      card.style.animationDelay = (i * 0.07) + 's';

      var descEl = document.createElement('div');
      descEl.className = 'scene-description';
      descEl.textContent = cena.descricao;
      descEl.title = 'Clica para editar';
      descEl.onclick = function() { makeDescEditable(descEl, i); };

      card.innerHTML =
        '<div class="frame-visual">' +
          '<div class="frame-number">' + String(cena.numero).padStart(2,'0') + '</div>' +
          '<div class="frame-drawing">' + generateContextualSVG(cena.descricao, cena.tipo_plano, cena.titulo) + '</div>' +
          '<div class="frame-shot-type">' + (cena.tipo_plano || 'Plano') + '</div>' +
        '</div>' +
        '<div class="scene-info">' +
          '<div class="scene-header">' +
            '<div class="scene-title">' + cena.titulo + '</div>' +
            '<button class="btn-regen" data-regen="' + i + '" onclick="regenScene(' + i + ')">↺ REGENERAR</button>' +
          '</div>' +
        '</div>';

      var info = card.querySelector('.scene-info');
      info.appendChild(descEl);

      var metaDiv = document.createElement('div');
      metaDiv.className = 'scene-meta';
      metaDiv.innerHTML =
        (cena.transicao ? '<span class="meta-tag tag-transition">' + cena.transicao + '</span>' : '') +
        (cena.movimento_camara ? '<span class="meta-tag tag-camera">' + cena.movimento_camara + '</span>' : '') +
        (cena.duracao ? '<span class="meta-tag tag-duration">' + cena.duracao + '</span>' : '');
      info.appendChild(metaDiv);

      if (cena.ambiente) {
        var ambDiv = document.createElement('div');
        ambDiv.className = 'scene-ambiente';
        ambDiv.textContent = '💡 ' + cena.ambiente;
        info.appendChild(ambDiv);
      }

      var hintDiv = document.createElement('div');
      hintDiv.className = 'edit-hint';
      hintDiv.textContent = 'CLICA NA DESCRIÇÃO PARA EDITAR';
      info.appendChild(hintDiv);

      grid.appendChild(card);
    });

    output.style.display = 'block';
    output.scrollIntoView({ behavior: 'smooth' });
  }

  function showStatus(type, msg) {
    var el = document.getElementById('status');
    el.className = 'status ' + type;
    document.getElementById('statusText').textContent = msg;
  }

  function hideStatus() {
    var el = document.getElementById('status');
    el.className = 'status';
    el.style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('narrative').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') generateStoryboard();
    });
  });
</script>
